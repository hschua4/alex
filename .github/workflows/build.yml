# Gate → build → push → deploy (DEPLOYMENT.md #3, #20, #21).
#
# The build pipeline is the only gate before prod, so typecheck + lint + tests
# must pass before any image is pushed. Images are built here, never on the
# 4 GB VPS.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# A newer push supersedes an in-flight build, but never cancels a run that has
# already reached the deploy stage.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  gate:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `project.test.ts` and `invite.test.ts` are not mocked — they exercise
    # tenancy and the invite gate against a real database. Same image as prod
    # (alex ADR-0008), published on 5434 so the tests' built-in default URL
    # resolves too.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alex
          POSTGRES_PASSWORD: alex
          POSTGRES_DB: alex
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U alex -d alex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://alex:alex@localhost:5434/alex

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      # The DB-backed tests insert real rows, so the schema has to exist first.
      - run: pnpm db:migrate

      # Models are fully mocked (ADR-0012), so no provider keys are needed. The
      # integration tests additionally start their own pgvector container via
      # Testcontainers — Docker is present by default on GitHub-hosted runners.
      - run: pnpm test

  image:
    name: build & push image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Public Umami website id, compiled into the SPA (DEPLOY.md
          # #1.5). A repo variable, not a secret — it is visible in the bundle.
          # Unset resolves to an empty string, which ships no tracker.
          build-args: |
            VITE_UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: deploy
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.image.outputs.tag }}
    secrets: inherit
