# Dev-only Postgres for Alex, pinned to pgvector/pgvector:pg16 to match the
# swapped shared prod image exactly (ADR-0008, CONTEXT §8 dev/prod parity).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: alex-db
    environment:
      POSTGRES_USER: alex
      POSTGRES_PASSWORD: alex
      POSTGRES_DB: alex
    ports:
      # Host 5434 avoids clashing with other Postgres instances already bound to
      # 5432/5433 on this box. Container still listens on 5432.
      - "5434:5432"
    volumes:
      - alex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alex -d alex"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only S3-compatible store for original uploads, standing in for R2
  # (ADR-0007). The app talks to it via the same @aws-sdk/client-s3 path it uses
  # for R2 in prod — path-style routing, custom endpoint.
  minio:
    image: minio/minio:latest
    container_name: alex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alex
      MINIO_ROOT_PASSWORD: alexsecret
    ports:
      # 9000 API, 9001 web console. High ports to avoid clashes on the box.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - alex-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket the app expects, then exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 alex alexsecret &&
      mc mb --ignore-existing local/alex-documents &&
      echo 'bucket alex-documents ready'
      "

volumes:
  alex-pgdata:
  alex-minio:
